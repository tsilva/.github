name: Trusted production delivery

on:
  workflow_call:
    inputs:
      sync_only:
        description: Sync Production variables for a separate prebuilt deployment job
        type: boolean
        default: false
      verify_deployment_id:
        description: Read-only manual recovery for a pinned event-driven deployment
        type: string
        default: ""
    secrets:
      VERCEL_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deliver:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id) ||
       (github.event_name == 'repository_dispatch' &&
        github.repository_id == '1411588422' && github.event.sender.id == 35613825 &&
        github.event.sender.login == 'vercel[bot]' && github.actor_id == '35613825' &&
        github.event.client_payload.project.id == 'prj_2O9aw5ukOM9mfDR1wSRM90sewBih' &&
        github.event.client_payload.environment == 'production' &&
        github.event.client_payload.git.sha == github.sha &&
        contains(fromJSON('["vercel.deployment.success","vercel.deployment.error","vercel.deployment.canceled","vercel.deployment.failed","vercel.deployment.ignored","vercel.deployment.skipped"]'), github.event.action)))
    # Fixed immutable caller mapping, never a caller-supplied runner input.
    runs-on: ${{ github.repository_id == '1411588422' && 'ubuntu-slim' || 'ubuntu-24.04' }}
    environment:
      name: Production
      # Submission is not live delivery. Keep environment access/protection,
      # but create the deployment record only for final verification.
      deployment: ${{ github.repository_id != '1411588422' || github.event_name == 'repository_dispatch' || inputs.verify_deployment_id != '' }}
    timeout-minutes: ${{ github.repository_id == '1411588422' && 14 || 60 }}
    steps:
      - name: Resolve the trusted workflow revision from GitHub OIDC
        id: trust
        shell: python3 {0}
        run: |
          import base64, json, os, re, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise RuntimeError("OIDC redirect rejected")
          try:
              url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              parsed = urllib.parse.urlsplit(url)
              assert parsed.scheme == "https" and parsed.hostname.endswith(".actions.githubusercontent.com")
              url += ("&" if parsed.query else "?") + urllib.parse.urlencode({"audience": "https://app.infisical.com"})
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              with urllib.request.build_opener(NoRedirect()).open(req, timeout=30) as response:
                  token = json.load(response)["value"]
              part = token.split(".")[1]
              claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
              match = re.fullmatch(r"tsilva/\.github/\.github/workflows/production-delivery\.yml@([0-9a-f]{40})", claims["job_workflow_ref"])
              assert match and claims["repository_owner_id"] == "26742"
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("revision=" + match[1] + "\n")
          except Exception:
              raise SystemExit("Cannot resolve the pinned trusted workflow; no credentials requested.") from None

      - name: Check out only the trusted delivery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tsilva/.github
          ref: ${{ steps.trust.outputs.revision }}
          path: trusted-delivery
          persist-credentials: false
          sparse-checkout: .github/actions/production-delivery

      - name: Validate the caller and its already successful exact-commit CI
        run: python3 trusted-delivery/.github/actions/production-delivery/production_delivery.py check
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DELIVERY_REVISION: ${{ steps.trust.outputs.revision }}

      - name: Fetch the caller's allowlisted secrets and sync Production
        if: github.event_name != 'repository_dispatch' && inputs.verify_deployment_id == ''
        run: python3 trusted-delivery/.github/actions/production-delivery/production_delivery.py sync
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DELIVERY_REVISION: ${{ steps.trust.outputs.revision }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Submit or deploy the exact synced commit
        if: github.event_name != 'repository_dispatch' && inputs.verify_deployment_id == '' && !inputs.sync_only
        run: python3 trusted-delivery/.github/actions/production-delivery/production_delivery.py deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DELIVERY_REVISION: ${{ steps.trust.outputs.revision }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify the completed deployment and Production domain without polling
        if: github.event_name == 'repository_dispatch' || inputs.verify_deployment_id != ''
        run: python3 trusted-delivery/.github/actions/production-delivery/production_delivery.py complete
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DELIVERY_REVISION: ${{ steps.trust.outputs.revision }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERIFY_DEPLOYMENT_ID: ${{ inputs.verify_deployment_id }}
