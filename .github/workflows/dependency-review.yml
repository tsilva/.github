name: Dependency review

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate portable lock and registry-only sources
        run: |
          uv lock --config-file uv.toml --check
          if grep -Eq 'source = \{ (git|url|path|directory) =' uv.lock; then
            echo "Non-registry dependency source found in uv.lock" >&2
            exit 1
          fi
          unexpected_editable="$(grep -E 'source = \{ editable =' uv.lock | grep -Fv 'source = { editable = "." }' || true)"
          if [ -n "$unexpected_editable" ]; then
            echo "Unexpected editable dependency source found in uv.lock" >&2
            exit 1
          fi
      - name: Audit frozen dependency graph
        run: uv audit --frozen
