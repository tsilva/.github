name: Test

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      pytest-args:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install the frozen dependency graph
        run: uv sync --frozen --all-extras
      - name: Validate the portable lockfile
        run: uv lock --config-file uv.toml --check
      - name: Audit dependencies
        run: uv audit --frozen
      - name: Lint
        # The legacy codebase has a tracked Ruff backlog; gate the remediation tests here.
        run: uv run --frozen ruff check tests/test_dependency_security.py
      - name: Test
        run: |
          exit_code=0
          uv run --frozen pytest ${{ inputs.pytest-args }} || exit_code=$?
          if [ $exit_code -eq 5 ]; then
            echo "No tests collected — skipping"
            exit 0
          fi
          exit $exit_code
      - name: Build package
        run: uv build
