name: CI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      pytest-args:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      python-version: ${{ inputs.python-version || '3.12' }}
      pytest-args: ${{ inputs.pytest-args || '' }}
