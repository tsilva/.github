name: Release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  publish:
    needs: [test]
    uses: ./.github/workflows/publish-pypi.yml
    permissions:
      contents: write
      id-token: write
    secrets: inherit
